<!--
- Semantic HTML allowed for organization in a page without a flood of "divs"
- Put links and external sources in the head of index.html
- "#" will relink to same page aka reload
- Best practice is to have id's all lowercase with dashes

- "#" for ids, "." for classes

- Tag is the brackets, element is the item itself
- Attributes are text in light blue, 
    - e.x. charset= and href=
        - class and id are examples of global attributes
        - hyperlinks are an example of non-global attributes 

- Classes are used to apply CSS to multiple sections/elements in a code
- ID's are meant to apply to only one section/element to identify it sepcifically 

- Block elements take up the whole screen width, wheeas inline takes up a smaller section within the block

- CSS
    -Using two padding values means the first = Top/Bottom, second = Left/Right, 4 will affect 4 borders respectively
    -CSS by default has its own quirks, which can be removed with resets
        -Resets: margins, padding, font size
    -Order of spacing: padding, border, margin
        -Padding: The spacing inside of the element
        -Margin: The spacing outside of the element
            -4 values go clockwise, 2 values go top/bottom & left/right, 1 value would adjust to all, auto will center accordingly
    -Specifying in CSS which element (e.x. header h1, .portfolio-section img) will change that respective element, disregarding other similar elements on the page
    -px should be avoided as rem is ore accessible
        -16px = 1rem
    -images are default inline elements unlike e.x. divs
        -To get imgs to center properly, add [display: block;]
    -In browsers like Chrome you can view the current CSS applied to the page by opening the window below the elements menu
        -Allows dynamic changes as a preview
    -Classes can be used to change color specifically, and be applied to elements as an additional class
        -Add multiple classes to an element in html by separating the classes with a space (e.x. <section class="about-conrent accent-1")
        -These color classes are cosndiered global variables, and add ease to changing a single color in a palette that is used all at once
    -H2 text content will display as a block element
        -To get decorative characteristics to display properly, change it to display: inline-block, which combines elements respecting margins
        -To retain spaces around text when altered with decoratve elements, use "&nbsp"
    -Use html {scroll-behaviour: smooth;} to make jumps to sections smooth based animation
    -To use linked fonts, link it as an href in the head in HTML, then reference it in CSS
        -HTML: (e.x. <link href="https://fonts.googleapis.com/css2?family=Josefin+Slab:ital,wght@0,100..700;1,100..700&family=Molle:ital@1&display=swap" rel="stylesheet">)
        -CSS: (e.x. font-family: "Molle", cursive;)
    -Use media queries to adjust for different device sizes
        -Cascade is applied, so make sue the order is correct
            -(e.x. max-width: 950px -> 750px) aka based on specificity 
        -Media queries callout the conditions (e.x. max-width), then class/ID (e.x. header), then element (e.x. padding)
            -Transitions can affect the animation during resizing 
    -Anchor tags are in-line elements, unlike divs
        -Add "display:xyz" & "width: zpx" to center text boxes
        -Another way is to put the anchor tag into a div with a class, then text-align
            -Transforming will not work unless display is set to "inline-block"
    -Hover characteristics can be applied with "".elementname:hover{}"
    -Transitions (occur upon an event)
        -Use "transition: all xs typeofease" to enable transitions for all characteristics
        -Apply the transition to specific elements by separating with commas and time (s)
    -Animations (occur upon load)
        -Use "@keyframes anim-name { from {background-color: xyz;} to {background-color: zyx;}}" below target class
            -Define how long or often the naimation plays with a value or "infinite", then "alternate" to transition the animation back and forth
            -Use percentages instead of "from" and "to" to add steps
    -Box sizing will control flex box elements to include any padding
    -Flex direction can be changed and used in media queries to ahve items stack differently based on screen
        -Gap is better than margin in flex boxes
        -Horizontal align: "justify-content"
        -Vertical: "align-items"



/*
CSS RESETS
*/


/* Change box-sizing default to border-box */
*,
*::before,
*::after {
  box-sizing: border-box;
}


/* Remove default spacing */
* {
  margin: 0;
  padding: 0;
}


/* Respect user font settings */
html {
  font-size: 100%;
}
