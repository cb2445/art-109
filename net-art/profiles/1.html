<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dive.zip</title>
    <link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>c.m. 242, profile k</header>

    <main>

        <section>
            <div class="items-grid">
                <div class="container-drink">
                    <img src="../images/americano.png" alt="americano in a bottle" class="items-image">
                    <div class="overlay">
                        <div class="items-text">
                            <p>bitter, but refreshing</p>
                        </div>
                    </div>
                </div>
                <div class="container-bag">
                    <img src="../images/blackbag.png" alt="black leather shoulder bag" class="items-image">
                    <div class="overlay">
                        <div class="items-text">
                            <p>quiet, but classic</p>
                        </div>
                    </div>
                </div>
                <div class="container-clip">
                    <img src="../images/clawclip.png" alt="brown claw clip" class="items-image">
                    <div class="overlay">
                        <div class="items-text">
                            <p>just useful, nothing colorful</p>
                        </div>
                    </div>
                </div>
                <div class="container-perfume">
                    <img src="../images/creedcarmina.png" alt="luxury perfume" class="items-image">
                    <div class="overlay">
                        <div class="items-text">
                            <p>rich velvet, leaves an impression</p>
                        </div>
                    </div>
                </div>
                <div class="container-lip">
                    <img src="../images/snoopybalm.png" alt="mango lip balm" class="items-image">
                    <div class="overlay">
                        <div class="items-text">
                            <p>tropical, but clear</p>
                        </div>
                    </div>
                </div>

            </div>

        </section>

        <a href="../archive.html" class="enter">close file</a>

    </main>


</body>

</html>
